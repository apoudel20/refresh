[project]
name = "imagegen"
version = "0.1.0"
description = "Generate, edit, upscale and texture-atlas images with AI image models (Codex subscription or OpenRouter), plus a Blender UV-atlas retexturing pipeline and agent skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2",
    "numpy>=2.0",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "scipy>=1.13",
]

[project.scripts]
imagegen = "imagegen.cli:main"
imagegen-mcp = "imagegen.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
