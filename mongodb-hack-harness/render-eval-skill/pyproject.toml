[project]
name = "render-eval"
version = "0.1.0"
description = "Grade how closely a render of a 3D model matches a reference image: 8 image evals, a VLM critic, run history, and vector encodings for comparing runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "httpx>=0.28.1",
    "lpips>=0.1.4",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "rembg[cpu]>=2.0.85",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.scripts]
render-eval = "render_eval.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["render_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
