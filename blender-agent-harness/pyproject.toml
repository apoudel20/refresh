[project]
name = "blender-agent-harness"
version = "0.2.0"
description = "Execution layer: BlenderAgent tool loop (Claude Code CLI / Anthropic / OpenAI / OpenRouter), Blender MCP connector, agent runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116",
    "mcp>=2.2",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pymongo>=4.6",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "render-eval",
    "imagegen",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]

[tool.uv.sources]
render-eval = { path = "../render-eval-skill", editable = true }
imagegen = { path = "../imagegen-skill", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_agent", "blender_mcp_connector", "agent_runner"]
