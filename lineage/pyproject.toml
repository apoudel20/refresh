[project]
name = "lineage"
version = "0.2.0"
description = "Memory-backed genetic search over agent structures (MongoDB Atlas)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pymongo>=4.7", "fastapi>=0.110", "uvicorn>=0.29", "python-dotenv", "requests", "mongomock"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage"]
